<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellingham Weather</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    background: #f0f4f8;
    color: #222;
  }
  h1, h2 {
    text-align: center;
  }
  #forecast, #radar, #rainfall {
    margin: 20px 0;
    padding: 15px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }
  #forecast ul {
    list-style-type: none;
    padding-left: 0;
  }
  #forecast li {
    margin-bottom: 10px;
  }
  img {
    width: 100%;
    border-radius: 8px;
  }
  footer {
    text-align: center;
    font-size: 0.85em;
    margin-top: 40px;
    color: #555;
  }
</style>
</head>
<body>

<h1>Bellingham Weather</h1>
<p style="text-align:center;">Local weather information for Bellingham, Washington</p>

<h2>Current Forecast</h2>
<div id="forecast">
  <p>Loading forecast...</p>
  <ul id="forecast-list"></ul>
</div>

<h2>Radar</h2>
<div id="radar">
  <img 
    src="https://radar.weather.gov/ridge/standard/NWUS54.KOTX_loop.gif?ts=0" 
    alt="Bellingham Radar Loop">
</div>

<h2>Rainfall / Precipitation</h2>
<div id="rainfall">
  <p>Rainfall data coming soon.</p>
</div>

<footer>
  &copy; 2026 BellinghamWeather.org | Data from <a href="https://www.weather.gov/" target="_blank">National Weather Service</a>
</footer>

<script>
// NWS API for Bellingham, WA (Seattle office gridpoint example)
const nwsPointUrl = "https://api.weather.gov/points/48.75,-122.48"; // Latitude/Longitude for Bellingham

async function loadForecast() {
  try {
    const headers = {
      "User-Agent": "BellinghamWeather (your-email@example.com)",
      "Accept": "application/geo+json"
    };

    const pointResp = await fetch(nwsPointUrl, { headers });
    const pointData = await pointResp.json();
    const forecastUrl = pointData.properties.forecast;

    const forecastResp = await fetch(forecastUrl, { headers });
    const forecastData = await forecastResp.json();

    const forecastList = document.getElementById("forecast-list");
    forecastList.innerHTML = '';
    
    forecastData.properties.periods.slice(0, 5).forEach(period => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${period.name}:</strong> ${period.detailedForecast}`;
      forecastList.appendChild(li);
    });

    const lastUpdated = new Date().toLocaleString();
    document.getElementById("forecast").insertAdjacentHTML('afterbegin', `<p>Last updated: ${lastUpdated}</p>`);
    
  } catch (err) {
    document.getElementById("forecast").innerHTML = "Forecast data unavailable.";
    console.error(err);
  }
}

// Call the function
loadForecast();

// Auto-refresh radar every 5 minutes
function refreshRadar() {
  const radarImg = document.querySelector("#radar img");
  radarImg.src = `https://radar.weather.gov/ridge/standard/NWUS54.KOTX_loop.gif?ts=${Date.now()}`;
}
setInterval(refreshRadar, 300000); // 5 minutes
</script>

</body>
</html>
