<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellingham Weather</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
/>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 0 20px 20px 20px;
  background: #f0f4f8;
  color: #222;
}
#banner {
  background-color: #0077cc;
  color: white;
  text-align: center;
  padding: 15px 0;
  font-size: 1.5em;
  border-radius: 0 0 8px 8px;
  margin-bottom: 20px;
}
h1,h2{text-align:center;}
.tile {
  margin:20px 0;
  padding:15px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,0.1);
}
#radar-map {height:500px; border-radius:8px;}
#forecast ul{list-style:none; padding-left:0;}
#forecast li{margin-bottom:10px;}
footer{text-align:center; font-size:0.85em; margin-top:40px; color:#555;}
</style>
</head>
<body>

<div id="banner">Bellingham Weather</div>

<h1>Bellingham, WA</h1>

<!-- Current Conditions -->
<h2>Current Conditions</h2>
<div id="current-conditions" class="tile">
  <p id="current-data">Loading current conditions...</p>
  <h3>Next 2 Hours</h3>
  <ul id="next-2-hours"></ul>
</div>

<!-- Forecast Summary -->
<h2>5-Day Forecast</h2>
<div id="forecast" class="tile">
  <p>Loading forecast...</p>
  <ul id="forecast-list"></ul>
</div>

<!-- Interactive Radar -->
<h2>Interactive Radar</h2>
<div id="radar-map" class="tile"></div>

<footer>
  &copy; 2026 BellinghamWeather.org | Data from <a href="https://www.weather.gov/" target="_blank">National Weather Service</a>
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
// -----------------
// Load Current Conditions + 5-Day Forecast + Next 2 Hours
// -----------------
const nwsPointUrl = "https://api.weather.gov/points/48.75,-122.48";

async function loadWeather() {
  try {
    const headers = {"User-Agent":"BellinghamWeather (your-email@example.com)","Accept":"application/geo+json"};
    const pointResp = await fetch(nwsPointUrl, {headers});
    const pointData = await pointResp.json();

    // 5-Day Forecast
    const forecastUrl = pointData.properties.forecast;
    const forecastResp = await fetch(forecastUrl, {headers});
    const forecastData = await forecastResp.json();

    // Current Conditions (first period)
    const current = forecastData.properties.periods[0];
    document.getElementById("current-data").innerHTML = `
      <strong>${current.name}</strong><br>
      Temperature: ${current.temperature}°${current.temperatureUnit}<br>
      Wind: ${current.windSpeed} ${current.windDirection}<br>
      Forecast: ${current.shortForecast}
    `;

    // 5-Day Forecast List
    const forecastList = document.getElementById("forecast-list");
    forecastList.innerHTML = '';
    forecastData.properties.periods.slice(0,5).forEach(p=>{
      const li = document.createElement("li");
      li.innerHTML = `<strong>${p.name}:</strong> ${p.detailedForecast}`;
      forecastList.appendChild(li);
    });

    // -----------------
    // Next 2 Hours Summary (Hourly API)
    // -----------------
    const hourlyUrl = pointData.properties.forecastHourly;
    const hourlyResp = await fetch(hourlyUrl, {headers});
    const hourlyData = await hourlyResp.json();

    const next2hoursList = document.getElementById("next-2-hours");
    next2hoursList.innerHTML = '';
    // Get next 2 periods (~1 hour each)
    hourlyData.properties.periods.slice(0,2).forEach(hour=>{
      const li = document.createElement("li");
      li.innerHTML = `<strong>${hour.name}:</strong> ${hour.temperature}°${hour.temperatureUnit}, ${hour.shortForecast}`;
      next2hoursList.appendChild(li);
    });

  } catch(err){
    document.getElementById("current-data").textContent="Current conditions unavailable.";
    document.getElementById("forecast").textContent="Forecast data unavailable.";
    document.getElementById("next-2-hours").innerHTML="<li>Hourly forecast unavailable.</li>";
    console.error(err);
  }
}

loadWeather();

// -----------------
// Leaflet Interactive Radar Map
// -----------------
const map = L.map('radar-map').setView([48.75,-122.48],7);

// Base layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

// NWS Radar overlay (BLI = Bellingham)
L.tileLayer('https://radar.weather.gov/ridge/standard/BLI_0/{z}/{x}/{y}.png',{
  attribution:'Radar &copy; National Weather Service'
}).addTo(map);

</script>

</body>
</html>
