<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellingham Weather</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 0 20px 20px 20px;
    background: #f0f4f8;
    color: #222;
  }

  /* Banner at top */
  #banner {
    background-color: #0077cc;
    color: #fff;
    text-align: center;
    padding: 15px 0;
    font-size: 1.5em;
    font-weight: bold;
    border-radius: 0 0 8px 8px;
    margin-bottom: 20px;
  }

  h1, h2 {
    text-align: center;
  }
  #forecast, #radar, #rainfall {
    margin: 20px 0;
    padding: 15px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }
  #forecast ul {
    list-style-type: none;
    padding-left: 0;
  }
  #forecast li {
    margin-bottom: 10px;
  }
  footer {
    text-align: center;
    font-size: 0.85em;
    margin-top: 40px;
    color: #555;
  }
</style>
</head>
<body>

<!-- Banner -->
<div id="banner">Just the Guys Weather Site</div>

<h1>Bellingham Weather</h1>
<p style="text-align:center;">Local weather information for Bellingham, Washington</p>

<h2>Current Forecast</h2>
<div id="forecast">
  <p>Loading forecast...</p>
  <ul id="forecast-list"></ul>
</div>

<h2>Radar</h2>
<div id="radar">
  <!-- Responsive Windy radar embed -->
  <div style="position:relative; width:100%; padding-bottom:66.66%; overflow:hidden; border-radius:8px;">
    <iframe
      src="https://embed.windy.com/embed2.html?lat=48.75&lon=-122.48&zoom=7&level=surface&overlay=radar&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default&radarRange=-1"
      style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
      title="Bellingham Radar">
    </iframe>
  </div>
</div>

<h2>Rainfall / Precipitation</h2>
<div id="rainfall">
  <p>Rainfall data coming soon.</p>
</div>

<footer>
  &copy; 2026 BellinghamWeather.org | Data from <a href="https://www.weather.gov/" target="_blank">National Weather Service</a>
</footer>

<script>
// NWS API for Bellingham, WA (Seattle office gridpoint)
const nwsPointUrl = "https://api.weather.gov/points/48.75,-122.48";

async function loadForecast() {
  try {
    const headers = {
      "User-Agent": "BellinghamWeather (your-email@example.com)",
      "Accept": "application/geo+json"
    };

    const pointResp = await fetch(nwsPointUrl, { headers });
    const pointData = await pointResp.json();
    const forecastUrl = pointData.properties.forecast;

    const forecastResp = await fetch(forecastUrl, { headers });
    const forecastData = await forecastResp.json();

    const forecastList = document.getElementById("forecast-list");
    forecastList.innerHTML = '';

    forecastData.properties.periods.slice(0, 5).forEach(period => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${period.name}:</strong> ${period.detailedForecast}`;
      forecastList.appendChild(li);
    });

    const lastUpdated = new Date().toLocaleString();
    document.getElementById("forecast").insertAdjacentHTML('afterbegin', `<p>Last updated: ${lastUpdated}</p>`);

  } catch (err) {
    document.getElementById("forecast").innerHTML = "Forecast data unavailable.";
    console.error(err);
  }
}

// Load forecast on page load
loadForecast();
</script>

</body>
</html>
