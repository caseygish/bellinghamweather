<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellingham Weather</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 1000px;
  margin: auto;
  padding: 0 20px 20px 20px;
  background: #f0f4f8;
  color: #222;
}
#banner {
  background-color: #0077cc;
  color: white;
  text-align: center;
  padding: 15px 0;
  font-size: 1.5em;
  border-radius: 0 0 8px 8px;
  margin-bottom: 20px;
}
h1,h2{text-align:center;}
.tile {
  margin:20px 0;
  padding:15px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,0.1);
  overflow: hidden; /* Keeps iframes rounded */
}
/* Style for Windy Iframes */
iframe {
  width: 100%;
  border: none;
  border-radius: 4px;
}
#radar-frame { height: 500px; }
#forecast-frame { 
  height: 520px;
}

#forecast-list {list-style:none; padding-left:0;}
#forecast-list li{margin-bottom:10px;}
footer{text-align:center; font-size:0.85em; margin-top:40px; color:#555;}
</style>
</head>
<body>

<div id="banner">Your Source for a Subdued Forecast</div>

<h1>Bellingham, WA</h1>

<!-- Current Conditions from NWS -->
<h2>Current Conditions</h2>
<div id="current-conditions" class="tile">
  <p id="current-data">Loading current conditions...</p>
  <h3>Two Hour Forecast</h3>
  <ul id="next-2-hours"></ul>
</div>

<!-- Detailed 7-Day Forecast Tile -->
<h2>Near Term Forecast Detail</h2>
<div class="tile">
<iframe id="forecast-frame"
  src="https://embed.windy.com"
  style="width:100%; height:520px; border: none;"
  loading="lazy"
  title="Bellingham 7-Day Forecast Detail">
</iframe>
</div>


<!-- Windy Interactive Radar (New) -->
<h2>Interactive Radar</h2>
<div class="tile">
<iframe id="radar-frame" 
  src="https://embed.windy.com/embed2.html?lat=48.75&lon=-122.48&zoom=9&level=surface&overlay=radar&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&detailLat=48.75&detailLon=-122.48&metricWind=mph&metricTemp=%C"
  style="width: 100%; height: 500px;" 
  title="Bellingham Local Radar">
</iframe>
</div>

<!-- NWS Text Forecast -->
<h2>Detailed Text Forecast</h2>
<div id="forecast" class="tile">
  <ul id="forecast-list"></ul>
</div>

<footer>
  &copy; 2026 BellinghamWeather.org | Data from <a href="https://www.weather.gov/" target="_blank">NWS</a> & <a href="https://www.windy.com" target="_blank">Windy.com</a>
</footer>

<script>
const nwsPointUrl = "https://api.weather.gov/points/48.75,-122.48";

async function loadWeather() {
  try {
    const headers = {"User-Agent":"BellinghamWeather (your-email@example.com)","Accept":"application/geo+json"};
    const pointResp = await fetch(nwsPointUrl, {headers});
    const pointData = await pointResp.json();

    // 5-Day Forecast
    const forecastUrl = pointData.properties.forecast;
    const forecastResp = await fetch(forecastUrl, {headers});
    const forecastData = await forecastResp.json();

    const current = forecastData.properties.periods[0];
    document.getElementById("current-data").innerHTML = `
      <strong>${current.name}</strong><br>
      Temperature: ${current.temperature}°${current.temperatureUnit}<br>
      Wind: ${current.windSpeed} ${current.windDirection}<br>
      Forecast: ${current.shortForecast}
    `;

    const forecastList = document.getElementById("forecast-list");
    forecastList.innerHTML = '';
    forecastData.properties.periods.slice(0,5).forEach(p=>{
      const li = document.createElement("li");
      li.innerHTML = `<strong>${p.name}:</strong> ${p.detailedForecast}`;
      forecastList.appendChild(li);
    });

    // Hourly
    const hourlyUrl = pointData.properties.forecastHourly;
    const hourlyResp = await fetch(hourlyUrl, {headers});
    const hourlyData = await hourlyResp.json();

    const next2hoursList = document.getElementById("next-2-hours");
    next2hoursList.innerHTML = '';
    hourlyData.properties.periods.slice(0,2).forEach(hour=>{
      const li = document.createElement("li");
      li.innerHTML = `<strong>${hour.name}:</strong> ${hour.temperature}°${hour.temperatureUnit}, ${hour.shortForecast}`;
      next2hoursList.appendChild(li);
    });

  } catch(err){
    console.error(err);
  }
}

loadWeather();
</script>

</body>
</html>
